name: "✨ Feature Request"
description: "Suggest an idea to make sdarm.life better"
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell us what you'd like to see.

  - type: input
    id: title
    attributes:
      label: "What's the feature?"
      placeholder: "e.g., Add dark theme toggle to all pages"
      description: "A short, clear summary"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: "Why do you want this?"
      placeholder: |
        Example:
        - I want to read long posts at night without eye strain
        - Users have asked for this multiple times
        - This would improve accessibility for low-vision users
      description: "The problem you're trying to solve or the user need"
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "What would it look like?"
      placeholder: |
        Example:
        - Button in the navbar to toggle theme
        - All colors automatically adjust
        - Preference saved in browser localStorage
      description: "How should it work? What's the expected flow or outcome?"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "How do we know it's done? (optional)"
      placeholder: |
        - [ ] Theme toggle visible on all pages
        - [ ] Light theme passes WCAG AA contrast
        - [ ] Preference persists across sessions
      description: "Any specific requirements or acceptance criteria"

  - type: textarea
    id: context
    attributes:
      label: "Additional context (optional)"
      placeholder: "Screenshots, links to similar features, design ideas, technical notes..."
      description: "Anything else that would help us understand the request"

  - type: dropdown
    id: app
    attributes:
      label: "Which app? (optional)"
      options:
        - "All apps"
        - "Web (sdarm.life)"
        - "Admin (admin.sdarm.life)"
        - "Songbook (songs.sdarm.life)"
        - "Treasures (treasures.sdarm.life)"
        - "Events (events.sdarm.life)"
        - "API (api.sdarm.life)"
