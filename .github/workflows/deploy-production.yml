name: Deploy Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # semver only — does not match v1.2.3-rc.1
  workflow_dispatch: # manual re-deploy (e.g. an already-pushed tag)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=@sdarm/api

  build-pages:
    strategy:
      matrix:
        include:
          - filter: '@sdarm/web'
            artifact: web-dist
            path: apps/web/.open-next
          - filter: '@sdarm/songbook'
            artifact: songbook-dist
            path: apps/songbook/.open-next
          - filter: '@sdarm/events'
            artifact: events-dist
            path: apps/events/.open-next
          - filter: '@sdarm/treasures'
            artifact: treasures-dist
            path: apps/treasures/.open-next
    uses: ./.github/workflows/_build-pages.yml
    with:
      filter: ${{ matrix.filter }}
      artifact-name: ${{ matrix.artifact }}
      dist-path: ${{ matrix.path }}

  # Not in the matrix above: sbl builds from a pinned upstream submodule and
  # stages static files rather than compiling a Next app.
  build-sbl:
    uses: ./.github/workflows/_build-pages.yml
    with:
      filter: '@sdarm/sbl'
      artifact-name: sbl-dist
      dist-path: apps/sbl/dist
      submodules: true

  build-admin:
    uses: ./.github/workflows/_build-pages.yml
    with:
      filter: '@sdarm/admin'
      artifact-name: admin-dist
      dist-path: apps/admin/.open-next
    secrets:
      NEXT_PUBLIC_API_KEY: ${{ secrets.API_KEY }}

  migrate:
    needs: [build-api, build-pages, build-sbl, build-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply sdarm-db --remote

  sync-secrets:
    needs: [build-api, build-pages, build-sbl, build-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            API_KEY
        env:
          API_KEY: ${{ secrets.API_KEY }}

  deploy-api:
    needs: [migrate, sync-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api

  deploy-pages:
    needs: deploy-api
    strategy:
      matrix:
        include:
          - artifact: web-dist
            app-path: apps/web
          - artifact: admin-dist
            app-path: apps/admin
          - artifact: songbook-dist
            app-path: apps/songbook
          - artifact: events-dist
            app-path: apps/events
          - artifact: treasures-dist
            app-path: apps/treasures
          - artifact: sbl-dist
            app-path: apps/sbl
            dist-path: dist
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      artifact-name: ${{ matrix.artifact }}
      app-path: ${{ matrix.app-path }}
      dist-path: ${{ matrix.dist-path || '.open-next' }}
    secrets: inherit

  sync-secrets-admin:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Sync API key to admin Worker
        working-directory: apps/admin
        run: echo "${{ secrets.API_KEY }}" | npx wrangler secret put API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
