name: Deploy Worker App

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      app-path:
        description: Workspace-relative path to the app (e.g. apps/web)
        required: true
        type: string
      dist-path:
        description: >-
          Directory, relative to app-path, that the build artifact unpacks into —
          it must match the `assets.directory` in that app's wrangler.jsonc. The
          Next apps all build to `.open-next`; @sdarm/sbl stages static files to
          `dist`.
        required: false
        type: string
        default: .open-next
      env:
        description: Wrangler environment to deploy to (e.g. staging). Leave empty for production.
        required: false
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.app-path }}/${{ inputs.dist-path }}
      - name: Deploy Worker
        working-directory: ${{ inputs.app-path }}
        run: |
          if [ -n "$DEPLOY_ENV" ]; then
            npx wrangler deploy --env "$DEPLOY_ENV"
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ inputs.env }}
